name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # --- PHP CodeSniffer (WordPress-Core + WordPress-Docs baseline) ---
  lint:
    name: Lint (phpcs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run phpcs
        run: vendor/bin/phpcs

  # --- Pure unit tests: no WordPress, no MySQL (fast feedback) ---
  unit-tests:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run unit tests (stub environment, no WordPress)
        run: composer test:unit

  # --- Integration tests: real WordPress test suite against MySQL ---
  integration-tests:
    name: Integration (PHP ${{ matrix.php }}, WP ${{ matrix.wp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
        wp: ['latest']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, mysqli, openssl
          coverage: none
          tools: composer:v2

      - name: Install subversion (needed by the WP test-suite installer)
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install WordPress test suite
        # The script asks interactively before dropping an existing test DB;
        # CI has no TTY, so answer "yes" (the mysql service is disposable).
        run: yes | bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp }}

      - name: Run full test suite (unit + integration)
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: vendor/bin/phpunit
