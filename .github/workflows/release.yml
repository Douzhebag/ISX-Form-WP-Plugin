name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build zip & attach to GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Package per .distignore — see docs/RELEASING.md for the full spec.
      # The zip root must be the plugin folder (insightx-form/) because the
      # plugin is deployed as a raw checkout via plugin-update-checker.
      - name: Build plugin zip
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD_DIR="$(mktemp -d)"
          mkdir -p "$BUILD_DIR/insightx-form"
          rsync -a --exclude-from=.distignore ./ "$BUILD_DIR/insightx-form/"
          cd "$BUILD_DIR"
          zip -qr "insightx-form-${VERSION}.zip" insightx-form
          mv "insightx-form-${VERSION}.zip" "$GITHUB_WORKSPACE/"
          unzip -l "$GITHUB_WORKSPACE/insightx-form-${VERSION}.zip"

      # Fail the release if packaging dropped files the plugin needs at
      # runtime (guards against .distignore patterns matching nested dirs,
      # e.g. the bare `vendor/` that once stripped PUC's Parsedown).
      - name: Verify packaged zip integrity
        run: |
          set -euo pipefail
          ZIP=$(ls insightx-form-*.zip)
          for required in \
            "insightx-form/libs/plugin-update-checker/vendor/ParsedownModern.php" \
            "insightx-form/advanced-secure-form.php" \
            "insightx-form/src/Crypto.php" \
            "insightx-form/languages/insightx-form-th.mo"; do
            unzip -l "$ZIP" | grep -q "$required" || { echo "::error::Missing from zip: $required"; exit 1; }
          done
          echo "Zip integrity check passed."

      - name: Attach zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: insightx-form-*.zip
